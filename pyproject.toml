[project]
name = "ai-worlds-tracker"
version = "0.1.0"
description = "Evidence-backed research pipeline for AI-generated interactive worlds"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3", "httpx>=0.27,<1", "pyyaml>=6,<7", "pandas>=2",
    "typer>=0.15", "openai>=1.68", "firecrawl-py>=2", "python-dotenv>=1,<2",
    "playwright>=1.50,<2", "Pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
