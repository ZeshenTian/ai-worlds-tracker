name: Sync worlds
on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
permissions:
  contents: write
concurrency:
  group: worlds-catalog
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULED_SYNC == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.11
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/processed/extraction
            data/state/apify_x
          key: worlds-sources-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: worlds-sources-
      - run: uv run playwright install --with-deps chromium
      - name: Refresh public directory seeds
        id: catalogs
        continue-on-error: true
        run: uv run python -m src.catalog_discovery
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      - name: Collect X posts and thread evidence
        id: apify
        continue-on-error: true
        timeout-minutes: 8
        run: uv run python -m src.apify_x --mode incremental --page-size 20 --budget-usd 0.30
        env:
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
      - run: uv run python -m src.sync_catalog
        env:
          X_ADAPTER: apify
          EXTRACTION_MODEL: gpt-4.1-mini
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY || secrets.FIRECRAWL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_APPROVE_TRUSTED: ${{ vars.AUTO_APPROVE_TRUSTED || 'false' }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/raw
            data/processed/extraction
            data/state/apify_x
          key: worlds-sources-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit snapshot and review queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state data/processed/cases.jsonl data/exports platform/data platform/public/thumbnails
          if ! git diff --cached --quiet; then
            git commit -m 'Sync catalog and review queue'
            git push origin HEAD:main
          fi
      - uses: ./.github/actions/publish-static
      - name: Record provider outcomes
        if: always()
        env:
          DIRECTORY_STATUS: ${{ steps.catalogs.outcome }}
          X_STATUS: ${{ steps.apify.outcome }}
        run: |
          echo "Directory discovery $DIRECTORY_STATUS. Apify collection $X_STATUS." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DIRECTORY_STATUS" != success || "$X_STATUS" != success ]]; then
            echo "::warning::Partial discovery; inspect provider steps for details."
          fi
