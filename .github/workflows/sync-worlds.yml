name: Sync worlds
on:
  workflow_dispatch:
    inputs:
      force:
        description: '即使本时段已发布，也重新同步'
        type: boolean
        default: false
  schedule:
    # Asia/Shanghai: 06:17 morning, 07:07 morning retry, 19:23 evening.
    - cron: "17 22 * * *"
    - cron: "7 23 * * *"
    - cron: "23 11 * * *"
permissions:
  contents: write
concurrency:
  group: worlds-catalog
  cancel-in-progress: false
jobs:
  freshness:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULED_SYNC == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_sync: ${{ steps.check.outputs.should_sync }}
    steps:
      - name: 检查本时段是否已发布
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_SYNC: ${{ inputs.force }}
          TZ: Asia/Shanghai
        run: |
          set -eu
          if [[ "$FORCE_SYNC" != true ]]; then
            read -r day time <<< "$(date '+%F %H:%M')"
            if [[ "$time" < '06:17' ]]; then
              day=$(date -d "$day yesterday" +%F)
              start='19:23'
            elif [[ "$time" < '19:23' ]]; then
              start='06:17'
            else
              start='19:23'
            fi
            since=$(date -u -d "$day $start +0800" '+%FT%TZ')
            if runs=$(gh api --method GET --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/sync-worlds.yml/runs" \
              -f status=completed -f created=">=$since" -f per_page=100 \
              --jq '.workflow_runs[].id'); then
              for run in $runs; do
                if published=$(gh api --method GET \
                  "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
                  --jq '.jobs[].steps[] | select(.name == "Run ./.github/actions/publish-feed" and .conclusion == "success") | .name') && [[ -n "$published" ]]; then
                  echo 'should_sync=false' >> "$GITHUB_OUTPUT"
                  echo "WorldFeed 已由运行 $run 发布，跳过重复采集。"
                  exit 0
                fi
              done
            else
              echo '::warning::无法查询近期运行记录，继续本次同步。'
            fi
          fi
          echo 'should_sync=true' >> "$GITHUB_OUTPUT"
  sync:
    needs: freshness
    if: needs.freshness.outputs.should_sync == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.11
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/processed/extraction
            data/state/apify_x
          key: worlds-sources-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: worlds-sources-
      - run: uv run playwright install --with-deps chromium
      - name: Refresh public directory seeds
        id: catalogs
        continue-on-error: true
        run: uv run python -m src.catalog_discovery
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY || secrets.FIRECRAWL_TOKEN }}
      - name: Collect X posts and thread evidence
        id: apify
        continue-on-error: true
        timeout-minutes: 8
        run: uv run python -m src.apify_x --mode incremental --actor kaito --page-size 20 --budget-usd 1.50
        env:
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
      - run: uv run python -m src.sync_catalog
        env:
          X_ADAPTER: apify
          ATLAS_BROWSER_CHANNEL: chrome
          GATE_MODEL: ${{ vars.GATE_MODEL || 'auto' }}
          EXTRACTION_MODEL: ${{ vars.EXTRACTION_MODEL || 'auto' }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY || secrets.FIRECRAWL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATLAS_FRONTIER_ONLY: 'true'
          ATLAS_MIN_LIKES: '15'
          AUTO_APPROVE_TRUSTED: ${{ vars.AUTO_APPROVE_TRUSTED || 'true' }}
      - name: Record confirmed daily Apify charges
        if: always()
        run: uv run python -m src.sync_receipt
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/raw
            data/processed/extraction
            data/state/apify_x
          key: worlds-sources-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv run python -m src.generate_trends_report
      - run: uv run python -m src.fetch_github_stars --refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci && node scripts/probe-embeds.mjs && node scripts/build-feed-data.mjs && npm run build
        working-directory: feed
        env:
          VITE_ATLAS_URL: ${{ vars.VITE_ATLAS_URL }}
      - run: uv run python -m src.generate_trends_report
      - name: Commit snapshot and review queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state data/processed/cases.jsonl data/exports reports/frontier_trends_report.md platform/data platform/public/thumbnails feed/public
          if ! git diff --cached --quiet; then
            git commit -m 'Sync catalog and review queue'
            git push origin HEAD:main
          fi
      - uses: ./.github/actions/publish-static
        env:
          NEXT_PUBLIC_WORLDFEED_URL: ${{ vars.NEXT_PUBLIC_WORLDFEED_URL }}
      - uses: ./.github/actions/publish-feed
        env:
          VITE_ATLAS_URL: ${{ vars.VITE_ATLAS_URL }}
      - name: Record provider outcomes
        if: always()
        env:
          DIRECTORY_STATUS: ${{ steps.catalogs.outcome }}
          X_STATUS: ${{ steps.apify.outcome }}
        run: |
          echo "Directory discovery $DIRECTORY_STATUS. Apify collection $X_STATUS." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DIRECTORY_STATUS" != success || "$X_STATUS" != success ]]; then
            echo "::warning::Partial discovery; inspect provider steps for details."
          fi
