name: Review a world
on:
  workflow_dispatch:
    inputs:
      world_id:
        description: World ID from the review queue
        required: true
      status:
        description: Review decision
        type: choice
        required: true
        options:
          - approved
          - rejected
          - pending
permissions:
  contents: write
concurrency:
  group: worlds-catalog
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.11
      - run: uv run python -m src.publish_catalog --review "$WORLD_ID" --status "$STATUS"
        env:
          WORLD_ID: ${{ inputs.world_id }}
          STATUS: ${{ inputs.status }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed/cases.jsonl data/exports platform/data
          if ! git diff --cached --quiet; then
            git commit -m 'Apply catalog review'
            git push origin HEAD:main
          fi
      - uses: ./.github/actions/publish-static
