# Golden Recall & Precision Benchmark (v1.1 — 2026-11-25, User-Approved Policy)
#
# CRITICAL RULE:
#   DO NOT add any URL or tweet_id in this file to config/seeds.yaml `seed_urls`!
#   This file is a strictly held-out blind evaluation set used to measure
#   whether our natural X search queries, author watches, and qualifier rules
#   discover frontier 3D worlds (recall) and reject non-worlds / ads (precision).
#
# Locked User Policies (2026-11-25):
#   1. Frontier models (>=): GPT-6.2 Astra, Claude Fable 5.2, Claude Opus 5.5/5.6, Gemini 4 series.
#   2. Date-inferred frontier: Generic family name without version number (e.g. "Claude", "Gemini", "GPT")
#      published on/after the frontier launch window (2026-11-10 for Claude/Gemini; 2026-11-17 for GPT)
#      counts as `frontier` unless an older version is explicitly stated.
#   3. Work types: Class A (interactive_world) + Class B (coded_3d_scene) INCLUDED.
#   4. Exclusions: Class C (tool/repo listicles), pure diffusion video-gen, secondary aggregator reposts,
#      AND sponsored / PR promotional posts (e.g. 【PR】, #ad, paid promo deals) are EXCLUDED.
#
# Scoring guide:
#   - Core Recall      = hits in `positive_core` / len(`positive_core`)           (target >= 85%)
#   - Long-Tail Recall = hits in `positive_long_tail` / len(`positive_long_tail`) (diagnostic for Latest-mode coverage)
#   - Negative Leakage = false positives in `negative_controls`                   (target = 0%)
#   - Secondary Leads  = tracked separately; must NOT be published attributed to aggregator handle.

version: "1.1"
created_at: "2026-11-25"
scope:
  frontier_models:
    - "GPT-6.2 Astra (>= 6.2)"
    - "Claude Fable 5.2 (>= 5.2)"
    - "Claude Opus 5.5 / 5.6 (>= 5.5)"
    - "Gemini 4 series (>= 4, e.g. Gemini 4 Neon / Hydrogen / Carbon / Argon)"
  date_inferred_frontier_cutoffs:
    claude: "2026-11-10"
    gemini: "2026-11-10"
    gpt: "2026-11-17"
  included_work_types:
    - "interactive_world"   # Class A: interactive 3D world / game (live link or recorded video)
    - "coded_3d_scene"      # Class B: AI-coded 3D rendering / shader / physics animation clip (NOT diffusion video gen)
  excluded_work_types:
    - "tool_listicle"       # Class C: repo roundups / tips / tutorials without a concrete world
    - "diffusion_video_gen" # Pure Sora/Veo/Runway-style video generation without 3D code/engine
    - "sponsored_pr"        # Sponsored / PR / paid-promo posts (【PR】, #ad, commercial promo pitches)
    - "aggregator_repost"   # Secondary workflow-breakdown / UGC distribution accounts

